# The features and the roles of the page, in the order of their buttons, and
# the scenarios of each feature and roles. The roles of a pair are joined with
# "+" in the order of the roles here, as "server+tester". The files of a
# scenario are in examples/<feature>/<roles>/<scenario>/, and a scenario
# without them is shown as coming soon; "files" orders its tabs and names
# them, and the files that it does not list follow in the order of their paths.

features:
  - id: application
    title: Application
    summary: Web applications, from one file to a whole project
  - id: http
    title: HTTP
    summary: HTTP and WebSocket server and client
  - id: html
    title: HTML
    summary: Templates, DOM and CSS selectors
  - id: aws
    title: AWS
    summary: Amazon Web Services without boto3
  - id: gcp
    title: GCP
    summary: Google Cloud without its client libraries
  - id: mcp
    title: MCP
    summary: Model Context Protocol servers and clients
  - id: integrations
    title: Integrations
    summary: Glue with other frameworks and servers

roles:
  - id: server
    title: Server
  - id: client
    title: Client
  - id: cli
    title: CLI
  - id: tester
    title: Tester

scenarios:
  application:
    server:
      - id: lite
        title: Application in one file
        summary: Routes, actions and templates of Pyjoyment.Lite in one script
      - id: full
        title: Application with controllers
        summary: The class of the application, its controllers, templates and configuration, as pyjo generate app makes them
        files:
          - name: MyApp/__init__.py
          - name: MyApp/Controller/Notes.py
          - name: templates/notes/index.html.ep
          - name: templates/notes/show.html.ep
          - name: templates/layouts/default.html.ep
          - name: my_app.yml
          - name: MyApp/__main__.py
      - id: json-api
        title: JSON API with validation
        summary: JSON Schema of the type hints, which validates a request with the JSON Pointers of its errors
      - id: websocket
        title: WebSocket
        summary: An echo server, and its page with a WebSocket in the browser
      - id: sse
        title: Server-Sent Events
        summary: A countdown, written as it goes, without blocking the other connections
      - id: plugin
        title: Plugin of its own
        summary: A helper and the hooks of each request, which a plugin adds to the application
        files:
          - name: MyPlugins/Timing.py
          - name: app.py
    client:
      - id: non-blocking
        title: Non-blocking requests of an action
        summary: Two services at the same time, within a limit of time, while the server goes on
    cli:
      - id: generate
        title: New application with pyjo generate
        summary: A new application, in one file or with controllers, and the files of its deployment
      - id: commands
        title: Commands of the application
        summary: Servers, routes, requests without a server and code against the application
    tester:
      - id: test
        title: Test of an application
        summary: An application and its test in one script, with Pyjo.Test.Pyjo, without a server
      - id: websocket
        title: Test of a WebSocket
        summary: WebSockets and Server-Sent Events, tested without a server
    server+tester:
      - id: lite
        title: Application with its test
        summary: A script of Pyjoyment.Lite and the test of its session, as pyjo-prove runs it
        files:
          - name: app.py
          - name: t/app.py
  http:
    server:
      - id: django
        title: Django application
      - id: lambda
        title: AWS Lambda function
        summary: The same application as a server and as an event function behind a Function URL
      - id: static
        title: Static file server
      - id: unix
        title: Unix server
      - id: windows
        title: Windows server
    client:
      - id: blocking
        title: Blocking user agent
      - id: non-blocking
        title: Non-blocking user agent
    cli:
      - id: one-liners
        title: GET and POST one-liners
        summary: Requests from the command line, with the functions of python -m Pyjo
    tester:
      - id: test
        title: Test of HTTP
  html:
    server:
      - id: static
        title: Static files
      - id: templates
        title: Dynamic templates
    client:
      - id: dom-css
        title: DOM and CSS selectors
        summary: A page parsed and searched with Pyjo.DOM
    cli:
      - id: one-liners
        title: HTML and CSS one-liners
    tester:
      - id: test
        title: Test of HTML
  aws:
    server:
      - id: lambda
        title: Lambda function with layers
      - id: eks
        title: Pod of EKS with IRSA or Pod Identity
      - id: ecs
        title: ECS service
      - id: ec2
        title: EC2 instance
    client:
      - id: sts
        title: STS
      - id: s3
        title: S3
      - id: kms
        title: KMS
    cli:
      - id: sts-one-liner
        title: STS one-liner with ~/.aws
      - id: regions
        title: Script with getopt that lists the regions
    tester:
      - id: test
        title: Test of AWS
  gcp:
    server:
      - id: cloud-run
        title: Cloud Run
      - id: gke
        title: Pod of GKE with GSA and KSA or Workload Identity Federation
      - id: compute
        title: Compute Engine instance
    client:
      - id: jwt
        title: JWT
      - id: gcs
        title: GCS
      - id: kms
        title: KMS
    cli:
      - id: sts-one-liner
        title: STS one-liner with gcloud auth application-default
      - id: regions
        title: Script with getopt that lists the regions
    tester:
      - id: test
        title: Test of GCP
  mcp:
    server:
      - id: http
        title: MCP over HTTP
      - id: stdio
        title: MCP over stdio
    client:
      - id: http
        title: Connection to MCP over HTTP
      - id: stdio
        title: Connection to MCP over stdio
    cli:
      - id: client
        title: MCP client script with getopt
      - id: skills
        title: Skills of Pyjoyment
      - id: claude
        title: Pyjo-MCP server in Claude
    tester:
      - id: test
        title: Test of MCP
  integrations:
    server:
      - id: django
        title: Django application on a Pyjo server
      - id: asyncio
        title: asyncio application on a Pyjo server
      - id: lambda
        title: Lambda function on a Pyjo server
      - id: cgi
        title: CGI program on a Pyjo server
      - id: fastcgi
        title: FastCGI application on a Pyjo server
      - id: wsgi
        title: WSGI application on a Pyjo server
      - id: asgi
        title: ASGI application on a Pyjo server
      - id: cli
        title: CLI application on a Pyjo server
    client:
      - id: asyncio
        title: Pyjo application on an asyncio server
      - id: gunicorn
        title: Pyjo application on gunicorn
      - id: uvicorn
        title: Pyjo application on uvicorn
      - id: gevent
        title: Pyjo application on gevent
      - id: twisted
        title: Pyjo application on Twisted
      - id: django
        title: Pyjo application in Django
      - id: lambda
        title: Pyjo application on Lambda
    cli:
      - id: virtualenv
        title: Run from a virtualenv
      - id: uv
        title: Run with uv
      - id: crontab
        title: Run from crontab
      - id: systemd
        title: Run as a systemd service
    tester:
      - id: pytest
        title: pytest
      - id: unittest
        title: unittest
      - id: github
        title: GitHub Actions
      - id: junit
        title: JUnit reports
