apiVersion: v1
kind: ServiceAccount
metadata:
  name: myapp
  namespace: default
  # The service account of Google that the pod gets the token of; without it, the token is of this service account
  # itself, of Workload Identity Federation for GKE
  annotations:
    iam.gke.io/gcp-service-account: publisher@myproject.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      serviceAccountName: myapp
      containers:
        - name: myapp
          image: europe-west1-docker.pkg.dev/myproject/apps/myapp
          env:
            - name: TOPIC
              value: events
            # The server keeps serving for 5 seconds after TERM, until the proxies of the cluster know that the pod
            # stops, and its workers have 25 seconds more to finish their requests
            - name: PYJO_SHUTDOWN_DELAY
              value: "5"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
          livenessProbe:
            httpGet:
              path: /livez
              port: 3000
      terminationGracePeriodSeconds: 35
