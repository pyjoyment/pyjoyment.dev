# In the root of the repository, for site/ and t/ alike, as site/pyproject.toml goes into the function, and ruff skips
# a pyproject.toml without [tool.ruff]
line-length = 120
target-version = "py312"

[format]
quote-style = "single"

# The rules of Pyjoyment, whose conventions this repository follows.
[lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[lint.per-file-ignores]
# The script of Pyjoyment.Lite imports its functions, like `use Mojolicious::Lite` in Perl.
"site/app.py" = [
  # F403 "`from Pyjoyment.Lite import *` used; unable to detect undefined names"
  "F403",
  # F405 "`get` may be undefined, or defined from star imports"
  "F405",
]
# The examples of the page are scripts of Pyjoyment.Lite and tests, as the ones above and below.
"site/examples/**" = [
  # F403 "`from Pyjoyment.Lite import *` used; unable to detect undefined names"
  "F403",
  # F405 "`get` may be undefined, or defined from star imports"
  "F405",
]
# Test scripts import all test functions, like `use Test::More` in Perl.
"t/**" = [
  # F403 "`from Pyjo.Test import *` used; unable to detect undefined names"
  "F403",
  # F405 "`ok` may be undefined, or defined from star imports"
  "F405",
]

[lint.isort]
# Pyjo modules first, then the standard library, then the others, as in Pyjoyment.
known-first-party = ["Pyjo", "Pyjoyment"]
section-order = [
  "future",
  "first-party",
  "local-folder",
  "standard-library",
  "third-party",
]
lines-between-types = 1
lines-after-imports = 2
